server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the Compose gateway when requests arrive, so startup order is independent.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $signa_gateway "${SIGNA_TARGET}";

    location ~ ^/(api/v1(/|$)|icons/) {
        # Allow multipart overhead for the app's 10 MiB image uploads.
        client_max_body_size 12m;
        proxy_pass $signa_gateway$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 30s;
    }

    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
