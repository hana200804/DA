[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signa-ai"
version = "0.1.0"
description = "Dữ liệu, huấn luyện, đánh giá và dịch vụ nhận diện biển báo của Signa"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["pillow>=10", "numpy>=1.26"]
vnts = ["pillow>=10", "pyarrow>=15"]
# Bộ đánh giá chung (docs/04 §4)
eval = ["pycocotools>=2.0.8", "numpy>=1.26"]
# Huấn luyện ba mô hình (docs/04 §2). Phiên bản chốt trong nhánh huấn luyện.
train = ["ultralytics", "yolov5", "transformers", "torch"]
# Dịch vụ nhận diện (docs/04 §7, docs/07 §7)
serve = ["fastapi", "uvicorn[standard]", "python-multipart", "pillow"]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "pillow>=10", "numpy>=1.26"]

[tool.hatch.build.targets.wheel]
packages = ["src/signa_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
