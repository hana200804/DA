[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "signa-ai"
version = "0.1.0"
description = "Dữ liệu, huấn luyện, đánh giá và dịch vụ nhận diện biển báo của Signa"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
data = ["pillow>=10", "numpy>=1.26"]
vnts = ["pillow>=10", "pyarrow>=15"]
# Bộ đánh giá chung (docs/04 §4)
eval = ["pycocotools>=2.0.8", "numpy>=1.26"]
# Nạp checkpoint và suy luận DETR-R50 (signa_ai.detr), cùng phiên bản với notebook DETR
detr = ["torch", "transformers==4.57.6", "timm==1.0.24", "pillow>=10", "numpy>=1.26"]
# Huấn luyện ba mô hình (docs/04 §2). YOLOv5 dùng repo ultralytics/yolov5 ghim commit
# trong notebook, chạy ở runtime riêng vì repo đó cần ultralytics>=8.4.
train = [
    "signa-ai[detr]", "ultralytics==8.3.203", "albumentations==2.0.8", "scipy==1.17.1",
]
# Dịch vụ nhận diện (docs/04 §7, docs/07 §7)
serve-api = [
    "fastapi", "starlette>=1.10", "uvicorn[standard]", "python-multipart>=0.0.34",
    "pillow>=10", "numpy>=1.26",
]
serve = ["signa-ai[serve-api]", "ultralytics==8.3.203"]
# Ba mô hình. DETR dùng extra detr để cùng phiên bản với lượt đánh giá. YOLOv5 gốc cần
# ultralytics>=8.4, khác bản 8.3.203 đã dùng khi đánh giá YOLOv8 (ai/README.md).
serve-all = ["signa-ai[serve-api,detr]", "ultralytics==8.4.201", "pandas>=1.1.4"]
dev = [
    "signa-ai[eval]", "albumentations==2.0.8", "pytest>=8.0", "ruff>=0.6", "httpx>=0.27", "pillow>=10", "numpy>=1.26",
    "fastapi", "starlette>=1.10", "python-multipart>=0.0.34",
]

[tool.uv]
conflicts = [
    [{ extra = "serve-all" }, { extra = "serve" }],
    [{ extra = "serve-all" }, { extra = "train" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/signa_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Giữ nguyên từng byte của script đã chạy để đối chiếu SHA-256.
"experiments/yolov8s-960-v1.1-main-s0/inference-val/compare_val_sizes.executed.py" = ["E501"]
