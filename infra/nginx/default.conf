map $http_x_request_id $signa_request_id {
    ""      $request_id;
    default $http_x_request_id;
}

# Tra lại IP khi container upstream được tạo lại.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream signa_backend {
    zone signa_backend 64k;
    server backend:8080 resolve;
}

upstream signa_minio {
    zone signa_minio 64k;
    server minio:9000 resolve;
}

upstream signa_web_admin {
    zone signa_web_admin 64k;
    server web-admin:3000 resolve;
}

server {
    include /etc/nginx/signa/listen.conf;
    server_name _;
    server_tokens off;
    absolute_redirect off;

    proxy_http_version 1.1;
    # Host gốc là một phần chữ ký URL của MinIO, gồm cả cổng nếu có.
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-Id $signa_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;

    location = /api/v1 {
        return 308 /api/v1/;
    }

    location /api/v1/ {
        client_max_body_size 12m;
        proxy_pass http://signa_backend;
    }

    location = /actuator/health {
        proxy_pass http://signa_backend;
    }

    location = /actuator/health/readiness {
        proxy_pass http://signa_backend;
    }

    # Trả 404 cho mọi đường dẫn Actuator còn lại, tránh fallback vào SPA.
    location /actuator {
        return 404;
    }

    location /icons/ {
        limit_except GET {
            deny all;
        }
        proxy_pass http://signa_minio/sign-icons/;
    }

    # Giữ nguyên URI và query để MinIO xác thực chữ ký của URL.
    location ~ ^/(sign-crops|report-photos)/.+$ {
        limit_except GET {
            deny all;
        }
        access_log off;
        proxy_pass http://signa_minio;
    }

    location / {
        proxy_pass http://signa_web_admin;
    }
}
