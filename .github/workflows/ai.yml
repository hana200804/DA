name: AI

on:
  pull_request:
    paths:
      - 'ai/**'
      - '.github/workflows/ai.yml'
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - '.github/workflows/ai.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ''
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v6
        with:
          # tests/test_predict_test_notebook.py đọc REPO_COMMIT và lịch sử notebook train.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e '.[dev]'
          uv pip install 'torch==2.15.0+cpu' --index https://download.pytorch.org/whl/cpu
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Test
        run: |
          uv run --no-sync python -c 'import torch; assert torch.version.cuda is None'
          uv run --no-sync pytest
