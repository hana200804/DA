name: AI

on:
  pull_request:
    paths:
      - 'ai/**'
      - '.github/workflows/ai.yml'
  push:
    branches: [main]
    paths:
      - 'ai/**'
      - '.github/workflows/ai.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai
    steps:
      - uses: actions/checkout@v6
        with:
          # tests/test_predict_test_notebook.py đọc REPO_COMMIT và lịch sử notebook train.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e '.[dev]'
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
