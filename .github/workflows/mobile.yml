name: Android

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  build:
    name: Build, unit test và lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Cài Android SDK 37
        run: sdkmanager --install 'platforms;android-37.0'
      - name: Build và kiểm thử
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lint
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-build-and-reports
          path: |
            mobile/app/build/outputs/apk/debug/app-debug.apk
            mobile/app/build/reports/tests/testDebugUnitTest/
            mobile/app/build/test-results/testDebugUnitTest/TEST-*.xml
            mobile/app/build/reports/lint-results-*.*
  emulator:
    name: Android instrumented test và replay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Cài Android SDK 37
        run: sdkmanager --install 'platforms;android-37.0'
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/cache@v5
        id: avd
        with:
          path: ~/.android/avd
          key: android-avd-v1-${{ runner.os }}-api33-default-x86_64-pixel5
      - name: Tạo snapshot AVD
        if: steps.avd.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -memory 2048
          disable-animations: false
          script: echo 'Đã tạo AVD kiểm thử.'
      - name: Kiểm thử Android và thu số đo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          profile: pixel_5
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -memory 2048
          disable-animations: true
          working-directory: mobile
          script: bash ci/run-instrumented.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-emulator-replay
          path: |
            mobile/app/build/outputs/androidTest-results/connected/
            mobile/app/build/reports/androidTests/connected/
            mobile/build/ci/replay/
